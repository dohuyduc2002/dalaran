name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: oven-sh/setup-bun@v2

    - run: bun install --frozen-lockfile

    - run: bun run typecheck

    - run: bun test

    - run: bun publish
      env:
        NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
